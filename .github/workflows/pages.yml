name: Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    # 公開用のリポジトリでだけ動かす（fork では動かさない）
    if: github.repository == 'yuyumiayu/yuke-yusya-tools'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - run: npm test
      - run: python3 scripts/build_html.py
      - uses: actions/upload-pages-artifact@v5
        with: { path: dist }
      - id: deployment
        uses: actions/deploy-pages@v5
